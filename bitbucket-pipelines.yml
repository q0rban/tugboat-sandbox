image: tugboatqa/cli

pipelines:
  custom:
    tugboat-health-check:
      - step:
          name: Check Tugboat Base Previews
          image: tugboatqa/cli
          script:
            - .tugboat/check-base-previews.sh
  
  schedules:
    daily-tugboat-health-check:
      - cron: '0 11 * * *'  # 6:00 AM EST (11:00 AM UTC)
      - step:
          name: Daily Tugboat Health Check
          image: tugboatqa/cli
          script:
            - .tugboat/check-base-previews.sh